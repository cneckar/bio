name: Build docs on push

# Rebuilds docs/ from source (public/ + src/) on every push to published, so the
# committed build output can never drift from source. public/ is the source of
# truth; any manual edit to docs/ is overwritten by the next build.
#
# Loop safety: commits are pushed with the default GITHUB_TOKEN, whose pushes do
# NOT trigger new workflow runs; the commit message also carries [skip ci] and
# the paths-ignore filter excludes docs/ so a docs-only change can't re-trigger.

on:
  push:
    branches: [published]
    paths-ignore:
      - 'docs/**'

permissions:
  contents: write

concurrency:
  group: build-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build   # vite build -> docs/

      - name: Commit regenerated docs/ if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "docs/ already up to date — nothing to commit."
          else
            git commit -m "ci: rebuild docs/ from source [skip ci]"
            git push origin HEAD:published
          fi
