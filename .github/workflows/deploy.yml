name: Deploy to Cloudflare Workers

on:
  push:
    branches: [published]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 404-path-handler is private, so the default GITHUB_TOKEN can't fetch the
      # submodule. Check it out at the pinned commit with a read-only deploy key.
      - name: Resolve pinned 404-path-handler commit
        id: lib
        run: echo "sha=$(git rev-parse HEAD:vendor/404-path-handler)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: cneckar/404-path-handler
          ref: ${{ steps.lib.outputs.sha }}
          path: vendor/404-path-handler
          ssh-key: ${{ secrets.PATH_HANDLER_DEPLOY_KEY }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build   # vite build -> dist/

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
